name: Daily HR Brief

on:
  # 정시 발송(평일 10:00 KST)은 아래 schedule 이 아니라 cron-job.org 가
  # workflow_dispatch 를 호출해서 합니다. GitHub 무료 크론은 2026년 9~10월 기준
  # 예약보다 5~6시간 늦게 돌아서(실측: 10시 예약 → 15~16시 실행) 정시용으로 못 씁니다.
  schedule:
    # 아래 둘은 cron-job.org 가 멈췄을 때를 위한 백업입니다. 몇 시간 늦게라도
    # 그날 브리핑이 나가게 합니다. run.mjs 가 그날 발행 여부를 확인하므로
    # 정시 발송이 이미 성공한 날은 아무것도 하지 않습니다 — 메일 중복 없음.
    # 분(minute)을 0 으로 두면 더 밀립니다. GitHub 공식 권고대로 정각을 피했습니다.
    - cron: '7 1 * * 1-5'
    - cron: '7 3 * * 1-5'
  workflow_dispatch:
    inputs:
      send_mail:
        description: '메일도 보낼까요?'
        type: boolean
        default: true
      resend:
        description: '오늘 치가 이미 발행됐어도 다시 만들어 보내기'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 브리핑 생성 및 메일 발송
        env:
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'gemini' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.resend }}" = "true" ]; then
            ARGS="--force"
          fi
          if [ "${{ github.event.inputs.send_mail }}" = "false" ]; then
            npm run brief:nomail -- $ARGS
          else
            npm run brief -- $ARGS
          fi

      # 아래 네 단계는 앞 단계가 실패해도 실행합니다.
      # 메일 발송이 실패하면 run.mjs 가 exit 1 로 죽는데, 그때도 브리핑은 이미
      # content/ 에 저장된 상태입니다. 여기서 멈추면 그날 기록이 아카이브에도
      # 안 남고 사이트도 갱신되지 않습니다. 저장과 배포는 메일과 무관하게 끝냅니다.
      # 실패 자체는 워크플로가 빨간 X 로 끝나므로 놓치지 않습니다.
      - name: 결과 커밋
        if: ${{ !cancelled() }}
        run: |
          git config user.name  "hr-news-agent"
          git config user.email "actions@github.com"
          git add content/
          if git diff --staged --quiet; then
            echo "새로 저장할 브리핑이 없습니다."
          else
            git commit -m "브리핑 $(TZ=Asia/Seoul date +%Y-%m-%d)"
            git push
          fi

      - name: 사이트 빌드
        if: ${{ !cancelled() }}
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      - uses: actions/configure-pages@v5
        if: ${{ !cancelled() }}
      - uses: actions/upload-pages-artifact@v3
        if: ${{ !cancelled() }}
        with:
          path: ./out

  deploy:
    needs: brief
    # brief 잡이 메일 실패로 빨간불이어도 사이트는 배포합니다.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
