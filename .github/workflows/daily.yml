name: Daily HR Brief

on:
  schedule:
    # 00:00 UTC = 09:00 KST. GitHub 부하 상황에 따라 5~20분 늦게 시작될 수 있습니다.
    - cron: '0 0 * * 1-5'
  workflow_dispatch:
    inputs:
      send_mail:
        description: '메일도 보낼까요?'
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 브리핑 생성 및 메일 발송
        env:
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'gemini' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ "${{ github.event.inputs.send_mail }}" = "false" ]; then
            npm run brief:nomail
          else
            npm run brief
          fi

      - name: 결과 커밋
        run: |
          git config user.name  "hr-news-agent"
          git config user.email "actions@github.com"
          git add content/
          if git diff --staged --quiet; then
            echo "새로 저장할 브리핑이 없습니다."
          else
            git commit -m "브리핑 $(TZ=Asia/Seoul date +%Y-%m-%d)"
            git push
          fi

      - name: 사이트 빌드
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: brief
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
